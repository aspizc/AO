name: CI

'on':
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Local CI gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AGENTS_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      D007C_RUN_REAL_TMUX_PROBE: "1"
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22.13.0"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: requirements.lock

      - name: Build pinned tmux runtime
        run: |
          tmux_builder_image=$(python -c "import json; print(json.load(open('gateway/vendor/tmux-agents/manifest.json'))['offlineLinuxBuilder']['image'])")
          docker pull "$tmux_builder_image"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/tmux/tmux/releases/download/3.6a/tmux-3.6a.tar.gz \
            --output "$RUNNER_TEMP/tmux-3.6a.tar.gz"
          gateway/vendor/tmux-agents/build-offline.sh \
            "$RUNNER_TEMP/tmux-3.6a.tar.gz" "$RUNNER_TEMP/ao-tools"
          mkdir -p "$RUNNER_TEMP/ao-tools/bin"
          ln -s ../tmux-3.6a-agents.4-linux-amd64 "$RUNNER_TEMP/ao-tools/bin/tmux"
          echo "$RUNNER_TEMP/ao-tools/bin" >> "$GITHUB_PATH"
          echo "D007C_TEST_TMUX_PATH=$RUNNER_TEMP/ao-tools/bin" >> "$GITHUB_ENV"

      - name: Prepare isolated tmux server
        run: |
          mkdir -p "$RUNNER_TEMP/ao-tmux"
          echo "TMUX_TMPDIR=$RUNNER_TEMP/ao-tmux" >> "$GITHUB_ENV"
          TMUX_TMPDIR="$RUNNER_TEMP/ao-tmux" tmux new-session -d -s ao-ci-bootstrap

      - name: Install dependencies
        run: |
          uv venv --python python .venv
          . .venv/bin/activate
          uv pip sync --require-hashes requirements.lock
          uv pip install --no-deps --no-build-isolation -e cli -e orchestrator-langgraph --offline
          npm --prefix gateway ci

      - name: Run local CI gate
        run: |
          . .venv/bin/activate
          set +e
          ./scripts/ci.sh 2>&1 | tee /tmp/ao-ci-gate.log
          ci_status=${PIPESTATUS[0]}
          set -e
          if [ "$ci_status" -ne 0 ]; then
            gate_summary=$(tail -n 1 /tmp/ao-ci-gate.log)
            echo "::error title=Local CI gate summary::$gate_summary"
          fi
          exit "$ci_status"

      - name: Stop isolated tmux server
        if: always()
        run: tmux kill-server
