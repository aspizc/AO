[project]
name = "agents-cli"
version = "0.1.0"
description = "Operator CLI (agent-run) for the agents-orchestrator project"
license = "MIT"
authors = [{ name = "Carlos Asensio Pizarro" }]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1",
  "rich>=13.7,<16",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.scripts]
agent-run = "agents_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_cli"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Existing files exceed 88 columns in many places; defer wrapping churn to a
# formatter-focused task.
ignore = ["E501"]
