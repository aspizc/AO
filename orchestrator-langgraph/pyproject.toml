[project]
name = "orchestrator-langgraph"
version = "0.1.0"
description = "Deterministic LangGraph orchestration client for agents-gateway."
license = "MIT"
authors = [{ name = "Carlos Asensio Pizarro" }]
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2.5,<1.2.6",
  "langgraph-sdk>=0.4.4,<0.5",
  "mcp>=1.28.1,<2",
  "temporalio>=1.28.0,<2",
]

[project.optional-dependencies]
redis = [
  "redis>=5,<6",
]
dev = [
  "ruff>=0.4,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator_langgraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Existing files exceed 88 columns in many places; defer wrapping churn to a
# formatter-focused task.
ignore = ["E501"]
